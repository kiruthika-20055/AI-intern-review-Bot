<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Intern Review Bot</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1d2433;--mut:#667;--pri:#4f46e5;--ok:#16a34a;--bad:#dc2626;--warn:#d97706}
@media(prefers-color-scheme:dark){:root{--bg:#10131a;--card:#1a1f2b;--tx:#e8ebf3;--mut:#9aa3b5}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--tx)}
header{background:var(--pri);color:#fff;padding:14px 24px;display:flex;justify-content:space-between;align-items:center}
header a{color:#fff;text-decoration:none;font-weight:600}main{max-width:1100px;margin:20px auto;padding:0 16px}
.card{background:var(--card);border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:0 1px 4px #0002}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
input,textarea,button,select{font:inherit;padding:9px;border-radius:8px;border:1px solid #8884;background:var(--bg);color:var(--tx);width:100%;margin:4px 0}
button,.btn{background:var(--pri);color:#fff;border:0;cursor:pointer;width:auto;padding:9px 16px;text-decoration:none;border-radius:8px;display:inline-block}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:8px;border-bottom:1px solid #8883;text-align:left}
.tag{padding:2px 8px;border-radius:99px;font-size:12px;color:#fff;background:var(--mut)}
.assigned{background:var(--warn)}.review_scheduled{background:var(--pri)}.reviewed{background:var(--ok)}
.flash{background:#4f46e522;border-left:4px solid var(--pri);padding:10px;margin-bottom:12px;border-radius:6px}
.stat{font-size:28px;font-weight:700}small,.mut{color:var(--mut)}
</style></head><body>
<header><a href="/">🤖 AI Intern Review Bot</a><a href="/export">⬇ Export tracker.xlsx</a></header>
<main>{% for m in get_flashed_messages() %}<div class="flash">{{m}}</div>{% endfor %}{% block body %}{% endblock %}</main></body></html>
